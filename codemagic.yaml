workflows:
  android-workflow:
    name: Arido Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
      branch_filters: # الإصلاح هنا
        - name: main
          include: true
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --debug # نسخة تجريبية سريعة لفريقك
    artifacts:
      - build/app/outputs/flutter-apk/**.apk
